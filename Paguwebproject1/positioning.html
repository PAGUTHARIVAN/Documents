<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>
    <!--simple-login-page-->

        <h1 class="title">Login Page</h1>

        <p>Welcome to our login page!</p>
        <!--form-container-->
        <form class="form">
            <!--Input fileds-->
            <!--name-field-->
            <label for="name">
                Name
                <input type="text" id="name" value="name" placeholder="Enter Your Name" required>
            </label>
            <!--email-fielc-->
            <label for="email">
                Email
                <input type="email" id="email" value="email" placeholder="Enter Your Email" required>
            </label>
            <!--password-field-->
            <label for="password">
                Password
                <input type="password" id="password" value="password" placeholder="********" minlength="8" maxlength="8" required>
            </label>
            <!--login button-->
            <button type="submit">Login</button>

        </form>
    
</body>
</html>
